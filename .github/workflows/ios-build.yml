name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build iOS Application
        run: |
          cd ios
          xcodebuild build \
            -project PromptPay.xcodeproj \
            -scheme PromptPay \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package App / Payload
        run: |
          mkdir -p build/Payload
          cp -r ios/build/Release-iphoneos/PromptPay.app build/Payload/ || cp -r $(find ~/Library/Developer/Xcode/DerivedData -name "PromptPay.app" | head -n 1) build/Payload/
          cd build
          zip -r PromptPay.ipa Payload

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptPay-iOS-Build
          path: build/PromptPay.ipa
