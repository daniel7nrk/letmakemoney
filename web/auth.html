<!doctype html>
<html lang="en" class="js is-ready" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign In & Register — Rapport</title>
  <meta name="theme-color" content="#ebe8e1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/rapport.css" />
  <!-- Supabase Official JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
      margin: auto;
      z-index: 10;
    }
    .auth-card {
      background: var(--glass-card);
      border: 1px solid var(--rim);
      border-radius: var(--r-card, 24px);
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 36px 32px;
      text-align: left;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header .brand {
      justify-content: center;
      margin-bottom: 18px;
    }
    .auth-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin: 0 0 6px;
    }
    .auth-subtitle {
      font-size: 14px;
      color: var(--muted);
      margin: 0;
    }
    .auth-seg {
      background: var(--well);
      border-radius: 999px;
      padding: 4px;
      display: flex;
      margin-bottom: 24px;
      position: relative;
    }
    .auth-seg__btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 9px 16px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .auth-seg__btn.is-active {
      color: var(--text);
    }
    .auth-seg__pill {
      position: absolute;
      top: 4px;
      bottom: 4px;
      background: var(--glass-3);
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 0;
    }
    :root[data-theme="dark"] .auth-seg__pill {
      background: rgba(255, 255, 255, 0.16);
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .field-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .field-wrap .field-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--muted);
      pointer-events: none;
    }
    .field-wrap input {
      padding-left: 42px !important;
      padding-right: 42px !important;
    }
    .toggle-pass-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      padding: 4px;
      cursor: pointer;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-pass-btn:hover {
      color: var(--text);
    }
    .auth-alert {
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 10px;
    }
    .auth-alert.is-error {
      display: flex;
      background: color-mix(in srgb, var(--tomato) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--tomato) 40%, transparent);
      color: var(--tomato);
    }
    .auth-alert.is-success {
      display: flex;
      background: color-mix(in srgb, var(--pine) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--pine) 40%, transparent);
      color: var(--pine);
    }
    .auth-btn-submit {
      width: 100%;
      height: 46px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 14px;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }
    .auth-btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }
    .auth-footer a {
      color: var(--text);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 16px;
      transition: color 0.15s ease;
    }
    .back-home:hover {
      color: var(--text);
    }
  </style>
</head>
<body>
  <!-- Ambient Gradient Background -->
  <div class="mesh" aria-hidden="true">
    <i class="mesh__a"></i>
    <i class="mesh__b"></i>
    <i class="mesh__c"></i>
  </div>

  <div class="auth-container">
    <a href="index.html" class="back-home">
      <svg class="ico" viewBox="0 0 24 24" style="width:16px;height:16px;">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back to workspace
    </a>

    <div class="card auth-card">
      <!-- Header -->
      <header class="auth-header">
        <a class="brand magnetic" href="index.html" aria-label="Rapport">
          <span class="brand__mark" aria-hidden="true">R</span>
          <span class="brand__name">rapport</span>
        </a>
        <h1 class="auth-title" id="auth-title">Welcome back</h1>
        <p class="auth-subtitle" id="auth-subtitle">Enter your details to access your workspace.</p>
      </header>

      <!-- Segment Switcher -->
      <div class="auth-seg" role="tablist">
        <span class="auth-seg__pill" id="seg-pill"></span>
        <button type="button" class="auth-seg__btn is-active" id="tab-login" data-tab="login" role="tab">
          Sign In
        </button>
        <button type="button" class="auth-seg__btn" id="tab-signup" data-tab="signup" role="tab">
          Create Account
        </button>
      </div>

      <!-- Alert Message Box -->
      <div class="auth-alert" id="auth-alert" role="alert">
        <svg class="ico alert-ico" viewBox="0 0 24 24" style="width:18px;height:18px;flex-shrink:0;">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 8v4M12 16h.01"/>
        </svg>
        <span id="alert-text"></span>
      </div>

      <!-- Auth Form -->
      <form class="auth-form" id="auth-form" novalidate>
        <!-- Full Name (Only for Signup) -->
        <div class="field" id="field-name-group" style="display: none;">
          <label class="field__label" for="auth-name">Full name</label>
          <div class="field-wrap">
            <svg class="field-icon ico" viewBox="0 0 24 24">
              <circle cx="12" cy="8.5" r="3.8"/>
              <path d="M4.5 20c.8-3.8 3.8-6 7.5-6s6.7 2.2 7.5 6"/>
            </svg>
            <input id="auth-name" name="name" type="text" placeholder="Sofia Reyes" autocomplete="name" />
          </div>
        </div>

        <!-- Email (for both) -->
        <div class="field">
          <label class="field__label" for="auth-email">Work email</label>
          <div class="field-wrap">
            <svg class="field-icon ico" viewBox="0 0 24 24">
              <rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/>
              <path d="m4 7 8 6 8-6"/>
            </svg>
            <input id="auth-email" name="email" type="email" placeholder="sofia@rapport.app" autocomplete="email" required />
          </div>
        </div>

        <!-- Password (for both) -->
        <div class="field">
          <label class="field__label" for="auth-password">Password</label>
          <div class="field-wrap">
            <svg class="field-icon ico" viewBox="0 0 24 24">
              <rect x="4" y="11" width="16" height="10" rx="2.5"/>
              <circle cx="12" cy="16" r="1.5"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
            <input id="auth-password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="toggle-pass-btn" id="btn-toggle-pass" aria-label="Toggle password visibility">
              <svg class="ico" id="eye-ico" viewBox="0 0 24 24" style="width:18px;height:18px;">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password (Only for Signup) -->
        <div class="field" id="field-confirm-group" style="display: none;">
          <label class="field__label" for="auth-confirm">Confirm password</label>
          <div class="field-wrap">
            <svg class="field-icon ico" viewBox="0 0 24 24">
              <rect x="4" y="11" width="16" height="10" rx="2.5"/>
              <circle cx="12" cy="16" r="1.5"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
            <input id="auth-confirm" name="confirmPassword" type="password" placeholder="••••••••" autocomplete="new-password" />
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn--ink auth-btn-submit" id="btn-submit">
          <span id="btn-submit-text">Sign In</span>
          <span class="spinner" id="btn-spinner" style="display: none;"></span>
        </button>
      </form>

      <!-- Footer Help -->
      <footer class="auth-footer" id="auth-footer">
        Don’t have an account? <a href="#" id="link-switch">Create account</a>
      </footer>
    </div>
  </div>

  <script type="module">
    import { getSupabase } from './js/supabaseClient.js';

    document.addEventListener('DOMContentLoaded', () => {
      const supabase = getSupabase();

      let currentMode = 'login'; // 'login' | 'signup'

      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      const segPill = document.getElementById('seg-pill');
      const authTitle = document.getElementById('auth-title');
      const authSubtitle = document.getElementById('auth-subtitle');
      const fieldNameGroup = document.getElementById('field-name-group');
      const fieldConfirmGroup = document.getElementById('field-confirm-group');
      const inputName = document.getElementById('auth-name');
      const inputEmail = document.getElementById('auth-email');
      const inputPassword = document.getElementById('auth-password');
      const inputConfirm = document.getElementById('auth-confirm');
      const btnSubmit = document.getElementById('btn-submit');
      const btnSubmitText = document.getElementById('btn-submit-text');
      const btnSpinner = document.getElementById('btn-spinner');
      const alertBox = document.getElementById('auth-alert');
      const alertText = document.getElementById('alert-text');
      const linkSwitch = document.getElementById('link-switch');
      const authForm = document.getElementById('auth-form');
      const btnTogglePass = document.getElementById('btn-toggle-pass');

      // Align Pill
      function updateSegPill(activeBtn) {
        if (!segPill || !activeBtn) return;
        segPill.style.left = `${activeBtn.offsetLeft}px`;
        segPill.style.width = `${activeBtn.offsetWidth}px`;
      }

      function showAlert(msg, isError = true) {
        alertBox.className = `auth-alert ${isError ? 'is-error' : 'is-success'}`;
        alertText.textContent = msg;
        alertBox.style.display = 'flex';
      }

      function hideAlert() {
        alertBox.style.display = 'none';
      }

      function setMode(mode) {
        currentMode = mode;
        hideAlert();
        if (mode === 'login') {
          tabLogin.classList.add('is-active');
          tabSignup.classList.remove('is-active');
          updateSegPill(tabLogin);
          authTitle.textContent = "Welcome back";
          authSubtitle.textContent = "Enter your details to access your workspace.";
          fieldNameGroup.style.display = 'none';
          fieldConfirmGroup.style.display = 'none';
          btnSubmitText.textContent = "Sign In";
          linkSwitch.textContent = "Create account";
          inputPassword.setAttribute('autocomplete', 'current-password');
        } else {
          tabSignup.classList.add('is-active');
          tabLogin.classList.remove('is-active');
          updateSegPill(tabSignup);
          authTitle.textContent = "Create an account";
          authSubtitle.textContent = "Start managing your workspace with Supabase.";
          fieldNameGroup.style.display = 'block';
          fieldConfirmGroup.style.display = 'block';
          btnSubmitText.textContent = "Create Account";
          linkSwitch.textContent = "Sign in instead";
          inputPassword.setAttribute('autocomplete', 'new-password');
        }
      }

      // Initial alignment
      setTimeout(() => updateSegPill(tabLogin), 60);
      window.addEventListener('resize', () => {
        updateSegPill(currentMode === 'login' ? tabLogin : tabSignup);
      });

      tabLogin.addEventListener('click', () => setMode('login'));
      tabSignup.addEventListener('click', () => setMode('signup'));
      linkSwitch.addEventListener('click', (e) => {
        e.preventDefault();
        setMode(currentMode === 'login' ? 'signup' : 'login');
      });

      // Toggle Password Visibility
      let showPass = false;
      btnTogglePass.addEventListener('click', () => {
        showPass = !showPass;
        inputPassword.type = showPass ? 'text' : 'password';
        if (inputConfirm) inputConfirm.type = showPass ? 'text' : 'password';
      });

      // Form Submit
      authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const email = inputEmail.value.trim();
        const password = inputPassword.value;

        if (!email || !password) {
          showAlert("Please fill in all required fields.");
          return;
        }

        if (currentMode === 'signup') {
          const name = inputName.value.trim();
          const confirm = inputConfirm.value;

          if (!name) {
            showAlert("Please enter your full name.");
            inputName.focus();
            return;
          }
          if (password !== confirm) {
            showAlert("Passwords do not match.");
            inputConfirm.focus();
            return;
          }
          if (password.length < 6) {
            showAlert("Password must be at least 6 characters long.");
            inputPassword.focus();
            return;
          }

          // Supabase Sign Up
          btnSubmit.disabled = true;
          btnSpinner.style.display = 'inline-block';
          btnSubmitText.textContent = "Creating account...";

          try {
            const { data, error } = await supabase.auth.signUp({
              email,
              password,
              options: {
                data: {
                  full_name: name,
                  role: "Account Executive"
                }
              }
            });

            if (error) {
              showAlert(error.message || "Failed to create account.");
              btnSubmit.disabled = false;
              btnSpinner.style.display = 'none';
              btnSubmitText.textContent = "Create Account";
              return;
            }

            // Check if email confirmation is required or session exists
            if (data?.session) {
              localStorage.setItem('rapport:profile', JSON.stringify({
                name: name,
                email: email,
                role: "Account Executive",
                quota: 420000
              }));
              showAlert("Account created successfully! Redirecting...", false);
              setTimeout(() => {
                window.location.href = 'index.html';
              }, 1000);
            } else {
              showAlert("Account created! Check your email to confirm registration or sign in.", false);
              btnSubmit.disabled = false;
              btnSpinner.style.display = 'none';
              btnSubmitText.textContent = "Create Account";
            }
          } catch (err) {
            showAlert(err.message || "An unexpected error occurred.");
            btnSubmit.disabled = false;
            btnSpinner.style.display = 'none';
            btnSubmitText.textContent = "Create Account";
          }
        } else {
          // Supabase Sign In
          btnSubmit.disabled = true;
          btnSpinner.style.display = 'inline-block';
          btnSubmitText.textContent = "Signing in...";

          try {
            const { data, error } = await supabase.auth.signInWithPassword({
              email,
              password
            });

            if (error) {
              showAlert(error.message || "Invalid email or password.");
              btnSubmit.disabled = false;
              btnSpinner.style.display = 'none';
              btnSubmitText.textContent = "Sign In";
              return;
            }

            const user = data.user;
            const userName = user?.user_metadata?.full_name || email.split('@')[0];
            localStorage.setItem('rapport:profile', JSON.stringify({
              name: userName,
              email: email,
              role: user?.user_metadata?.role || "Account Executive",
              quota: 420000
            }));

            showAlert("Welcome back! Redirecting...", false);
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 800);
          } catch (err) {
            showAlert(err.message || "An unexpected error occurred.");
            btnSubmit.disabled = false;
            btnSpinner.style.display = 'none';
            btnSubmitText.textContent = "Sign In";
          }
        }
      });
    });
  </script>
</body>
</html>
