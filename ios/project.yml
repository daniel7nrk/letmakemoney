name: PromptPay
options:
  bundleIdPrefix: com.promptpay
targets:
  PromptPay:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - PromptPay
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.promptpay.app
      INFOPLIST_FILE: PromptPay/Info.plist
      SWIFT_VERSION: "5.9"
      ENABLE_PREVIEWS: YES
      CODE_SIGNING_STYLE: Automatic
      CODE_SIGNING_ALLOWED: YES
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      TARGETED_DEVICE_FAMILY: "1,2"
